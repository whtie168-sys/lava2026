workflows:

  ios-native-quick-start:

    name: lava2026

    max_build_duration: 120

    instance_type: mac_mini_m2


    integrations:

      app_store_connect: lava2026


    environment:

      ios_signing:

        distribution_type: app_store

        bundle_identifier: com.AureliazloiGrainayautuloliuyuanwei.cn


      vars:

        BUNDLE_ID: com.AureliazloiGrainayautuloliuyuanwei.cn

        PROJECT_PATH: "LAVA CHAT"

        XCODE_WORKSPACE: "LAVA CHAT/Lava.xcworkspace"

        XCODE_SCHEME: "LavaWildFireChat"

        APP_STORE_APPLE_ID: 6811342837


      xcode: latest



    scripts:


      - name: Set up provisioning profiles settings on Xcode project

        script: |

          xcode-project use-profiles



      - name: Increment build number

        script: |

          set -e
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          if [ -z "$LATEST" ]; then LATEST=0; fi
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest on App Store Connect: $LATEST -> using build $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"


      - name: Build ipa for distribution

        script: |

          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            --disable-xcpretty



    artifacts:

      - build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM



    publishing:


      email:

        recipients:

          - 985446278@qq.com

          - user_2@example.com


        notify:

          success: true

          failure: false



      app_store_connect:

        auth: integration

        submit_to_testflight: true

        submit_to_app_store: false
